<div class="login-container">

  <div class="login-card">


    <!-- =====================================
         HEADER
    ====================================== -->

    <div class="login-header">

      <div class="logo">
        P360
      </div>

      <h1>
        Bienvenido
      </h1>

      <p>
        Inicia sesión para continuar
      </p>

    </div>



    <!-- =====================================
         FORMULARIO
    ====================================== -->

    <form>


      <!-- CORREO -->

      <div class="form-group">

        <label for="email">
          Correo electrónico
        </label>

        <input
          type="email"
          id="email"
          placeholder="ejemplo@correo.com"
        >

      </div>



      <!-- CONTRASEÑA -->

      <div class="form-group">

        <label for="password">
          Contraseña
        </label>

        <input
          type="password"
          id="password"
          placeholder="Ingresa tu contraseña"
        >

      </div>



      <!-- OPCIONES -->

      <div class="options">

        <label class="remember">

          <input
            type="checkbox"
          >

          <span>
            Recordarme
          </span>

        </label>


        <a href="#">
          ¿Olvidaste tu contraseña?
        </a>

      </div>

      <!-- =====================================
           INICIAR SESIÓN
      ====================================== -->

      <button
        type="button"
        class="login-button"
        (click)="login()"
      >

        <span>
          Iniciar sesión con mi cuenta Microsoft 
        </span>

      </button>


    </form>



    <!-- =====================================
         REGISTRO
    ====================================== -->

    <div class="register">

      <span>
        ¿No tienes una cuenta?
      </span>

      <a href="#">
        Crear cuenta
      </a>

    </div>

  </div>

</div>
